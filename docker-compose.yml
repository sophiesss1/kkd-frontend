services:
  # Mock API собирается из репозитория задания (см. mock-api/Dockerfile) — клонировать его отдельно не нужно
  mock-api:
    build: ./mock-api
    ports:
      - "8000:8000"
    environment:
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-300}

  web:
    build:
      context: .
      args:
        # необязательный прямой адрес API для браузера, подставляется при сборке (см. README)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "3000:80"
    environment:
      API_URL: ${API_URL:-http://mock-api:8000}
    depends_on:
      - mock-api
